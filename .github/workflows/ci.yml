name: CI

# Verification gate for Orbit: lint, strict typecheck, JS tests + build, and the
# cross-platform Rust library crates. The full Tauri app (orbit-desktop) needs
# Windows + WebView2 + the Win32 toolchain, so its `cargo check`/`tauri build`
# run on the Windows job only.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  js:
    name: JS — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run v1:validate
      - run: npm run lint
      - run: npm run typecheck --workspaces --if-present
      - run: npm test
      - run: npm run build:vite --workspace @orbit/desktop

  rust-libs:
    name: Rust — cross-platform library crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: cargo test (pure/cross-platform crates)
        run: cargo test -p orbit-core -p orbit-search -p orbit-window-manager -p orbit-files

  windows-desktop:
    name: Windows — full workspace check
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production Windows desktop bundles
        run: npm run build --workspace @orbit/desktop
      - name: Attest Windows packages
        if: github.event_name == 'push'
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe

  v1-ci-evidence:
    name: V1 — attested mandatory gate evidence
    runs-on: ubuntu-latest
    needs: [js, rust-libs, windows-desktop]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Write V1 CI evidence report
        run: node scripts/write-v1-ci-evidence.mjs
      - name: Attest V1 CI evidence report
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: evidence/reports/v1-001/ci-gates.json
